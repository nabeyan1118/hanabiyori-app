<!doctype html>
<html lang="ja">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

      repeating-linear-gradient(95deg,transparent 0 7px,rgba(255,255,255,.012) 8px 9px),
      repeating-linear-gradient(2deg,transparent 0 13px,rgba(255,255,255,.01) 14px 15px)}

    .reflection{display:none;background:linear-gradient(135deg,rgba(18,36,21,.9),rgba(10,22,12,.9));border:1px solid var(--line);border-radius:18px;padding:19px 20px;margin:0 auto 22px;box-shadow:var(--shadow)}
    .reflection.show{display:block}.reflection small{color:var(--gold);letter-spacing:.16em}.reflection p{margin:8px 0 13px;line-height:1.75}.reflection-actions{display:flex;gap:8px;flex-wrap:wrap}.reflection-actions button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:.72rem;cursor:pointer}.reflection-actions button:hover{border-color:var(--green)}
    .stage{position:relative;background:linear-gradient(160deg,rgba(16,31,19,.94),rgba(7,16,8,.94));border:1px solid var(--line);border-radius:var(--radius);padding:30px clamp(16px,5vw,38px) 28px;box-shadow:var(--shadow);overflow:hidden}
    .stage:after{content:"";position:absolute;inset:9px;border:1px solid rgba(198,170,88,.08);border-radius:16px;pointer-events:none}
    .stage-head{text-align:center;position:relative;z-index:1}.kicker{color:var(--green);font-size:.68rem;letter-spacing:.24em}.stage h2{font-family:"Zen Old Mincho";font-weight:400;font-size:1.25rem;letter-spacing:.1em;margin:9px 0 7px}.stage-copy{color:var(--muted);font-size:.76rem;line-height:1.8;margin:0}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(9px,3vw,18px);margin:30px auto 26px;max-width:540px;position:relative;z-index:1}
    .slot{text-align:center;min-width:0}.slot-label{font-size:clamp(.57rem,2vw,.7rem);letter-spacing:.06em;color:#c3cab9;margin-bottom:9px;white-space:nowrap}.card{width:100%;aspect-ratio:92/124;position:relative;perspective:900px;filter:drop-shadow(0 9px 11px rgba(0,0,0,.3))}.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.22,.74,.18,1)}.card.revealed .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:7px;overflow:hidden}.front{transform:rotateY(180deg);background:#101810}.back{display:grid;place-items:center;background:linear-gradient(145deg,#112818,#07120b);border:2px solid #b39143;box-shadow:inset 0 0 0 4px #0b170d,inset 0 0 0 5px rgba(198,170,88,.5)}.back:before{content:"花";display:grid;place-items:center;width:45%;aspect-ratio:1;border:1px solid rgba(198,170,88,.55);border-radius:50%;font-family:"Zen Old Mincho";font-size:clamp(1rem,5vw,1.65rem);color:#bda251;background:rgba(198,170,88,.04)}
    .draw-wrap{text-align:center;position:relative;z-index:2}.draw{border:1px solid #c5a955;border-radius:999px;background:linear-gradient(180deg,#b99b44,#8b6e28);color:#081009;padding:14px 30px;min-width:220px;font-weight:700;letter-spacing:.1em;cursor:pointer;box-shadow:0 9px 25px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.28);transition:.25s}.draw:hover{transform:translateY(-2px);filter:brightness(1.08)}.draw:disabled{cursor:default;transform:none;filter:saturate(.65);opacity:.72}.once{display:block;margin-top:11px;color:#71806f;font-size:.65rem}
    .result{display:none;margin-top:24px}.result.show{display:block;animation:rise .65s ease both}.weather{text-align:center;padding:27px 20px 23px;background:radial-gradient(circle at 50% 0%,rgba(198,170,88,.1),transparent 70%);border-bottom:1px solid var(--line)}.weather-label{font-size:.64rem;color:var(--gold);letter-spacing:.25em}.weather h2{font-family:"Zen Old Mincho";font-size:clamp(1.8rem,7vw,2.7rem);font-weight:400;letter-spacing:.12em;margin:9px 0 12px}.weather p{max-width:34rem;margin:auto;color:#c1c9bb;font-size:.85rem;line-height:1.95}
    .readings{display:grid;gap:12px;margin:18px 0}.reading{background:rgba(15,30,18,.82);border:1px solid var(--line);border-radius:16px;padding:18px 19px}.reading-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.reading-index{color:var(--gold);font-family:"Zen Old Mincho"}.reading-role{font-size:.76rem;letter-spacing:.13em}.reading-card{margin-left:auto;color:var(--green);font-size:.69rem}.reading p{margin:0;color:#bcc5b7;line-height:1.9;font-size:.79rem}
    .action-box{position:relative;margin-top:14px;padding:25px 22px 23px;border-radius:18px;background:linear-gradient(135deg,rgba(38,63,39,.8),rgba(17,34,21,.92));border:1px solid rgba(130,186,128,.32)}.action-box small{color:#9cc49a;letter-spacing:.2em}.action-box h3{font-family:"Zen Old Mincho";font-weight:400;font-size:1.22rem;margin:10px 0 8px}.action-box p{margin:0;color:#d1d7ca;line-height:1.9;font-size:.83rem}
    .note{margin:20px auto 0;text-align:center;color:#788575;font-size:.67rem;line-height:1.8}.again{display:block;margin:20px auto 0;border:0;border-bottom:1px solid rgba(198,170,88,.4);background:none;color:#aeb8a9;padding:5px;cursor:pointer;font-size:.7rem}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:#e5e8dd;color:#0b140c;border-radius:999px;padding:10px 17px;font-size:.72rem;transition:.3s;z-index:30;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}
    footer{text-align:center;padding-top:38px;color:#60705f;font-size:.63rem;line-height:1.9}.footer-brand{font-family:"Zen Old Mincho";letter-spacing:.18em;color:#859383;margin-bottom:5px}

    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card-inner,.draw,.toast{transition:none}.result.show{animation:none}}
  </style>
</head>
<body>
  <a class="skip" href="#drawStage">占いへ進む</a>
  <main class="shell">
    <header>
      <div class="brand"><span class="crest">日</span><span class="brand-name">花札日和<small class="brand-sub">HANAFUDA BIYORI</small></span></div>
      <button class="sound" id="soundBtn" type="button" aria-pressed="true"><span aria-hidden="true" id="soundIcon">♪</span> <span class="sound-text" id="soundText">音あり</span></button>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <p class="eyebrow">一日一回、無料の三枚読み</p>
      <h1 id="heroTitle"><span>今日は、どんな</span><span>日和だろう。</span></h1>
      <p class="lead">巡りを知れば、進む・整える・休むを選びやすくなる。<br>未来を決めるのではなく、今日を選ぶための花札占いです。</p>
      <div class="date" id="todayLabel" aria-label="今日の日付"></div>
    </section>

    <section class="reflection" id="reflection" aria-label="昨日の振り返り">
      <small>昨日から、今日へ</small>
      <p id="reflectionText"></p>
      <div class="reflection-actions">
        <button type="button" data-reflect="できた">できた</button>
        <button type="button" data-reflect="少しだけ">少しだけ</button>
        <button type="button" data-reflect="まだ">まだ</button>
      </div>
    </section>

    <section class="stage" id="drawStage" aria-labelledby="drawTitle">
      <div class="stage-head">
        <span class="kicker">本日の三枚読み</span>
        <h2 id="drawTitle">心にひとつ、今日の問いを</h2>
        <p class="stage-copy">答えを急がず、ひと呼吸してから札をめくってください。</p>
      </div>
      <div class="cards" id="cards" aria-live="polite">
        <div class="slot"><div class="slot-label">今日の空模様</div><div class="card" id="card0"><div class="card-inner"><div class="face back"></div><div class="face front"></div></div></div></div>
        <div class="slot"><div class="slot-label">いまの現在地</div><div class="card" id="card1"><div class="card-inner"><div class="face back"></div><div class="face front"></div></div></div></div>
        <div class="slot"><div class="slot-label">今日の一手</div><div class="card" id="card2"><div class="card-inner"><div class="face back"></div><div class="face front"></div></div></div></div>
      </div>
      <div class="draw-wrap">
        <button class="draw" id="drawBtn" type="button">今日の札を、めくる</button>
        <span class="once">同じ日は、同じ三枚が現れます</span>
      </div>
    </section>

    <section class="result" id="result" aria-labelledby="weatherTitle">
      <div class="weather">
        <span class="weather-label">今日の日和</span>
        <h2 id="weatherTitle"></h2>
        <p id="weatherMessage"></p>
      </div>
      <div class="readings" id="readings"></div>
      <div class="action-box">
        <small>今日の一手</small>
        <h3 id="actionTitle"></h3>
        <p id="actionText"></p>
      </div>
      <p class="note">札は未来を決めるものではありません。<br>今日を自分で選ぶための、小さな手がかりとしてお楽しみください。</p>
      <button class="again" id="againBtn" type="button">三枚をもう一度見る</button>
    </section>

    <footer><div class="footer-brand">花札日和</div>巡りを知って、過ごし方を選ぶ。</footer>
  </main>
  <div class="toast" id="toast" role="status"></div>

      [3,'光','桜に幕','弥生','#200a14','#f8c8d8','木','人前に出る・節目を祝う'],[3,'短冊','桜の赤短','弥生','#200a14','#f098b0','木','今だけの輝きを味わう'],[3,'カス','桜のカス一','弥生','#200a14','#e0a8b8','木','移ろいの中の美しさ'],[3,'カス','桜のカス二','弥生','#200a14','#d098a8','木','流れに逆らわない'],

      [6,'種','牡丹に蝶','水無月','#200412','#f8b0d0','火','姿を変えてひらく'],[6,'短冊','牡丹の青短','水無月','#200412','#98b8e8','火','品よく境界を示す'],[6,'カス','牡丹のカス一','水無月','#200412','#e098b8','火','小さな豊かさ'],[6,'カス','牡丹のカス二','水無月','#200412','#d088a8','火','自分を丁寧に扱う'],
      [7,'種','萩に猪','文月','#201408','#e8c078','土','迷いを越える勢い'],[7,'短冊','萩の短冊','文月','#201408','#d8b068','土','変化を告げる言葉'],[7,'カス','萩のカス一','文月','#201408','#c8a058','土','移ろいを受け入れる'],[7,'カス','萩のカス二','文月','#201408','#b89048','土','焦らず進む'],

      [10,'種','紅葉に鹿','神無月','#1e0a04','#f0a868','金','気配に耳を澄ます'],[10,'短冊','紅葉の青短','神無月','#1e0a04','#88c088','金','実りを受け取る言葉'],[10,'カス','紅葉のカス一','神無月','#1e0a04','#e09058','金','変化の色を楽しむ'],[10,'カス','紅葉のカス二','神無月','#1e0a04','#d08048','金','落ち着きと成熟'],

    const ROLES=[
      {name:'今日の空模様',lead:'一日の背景には',tails:['という気配があります。無理に逆らわず、まず流れを眺めてみて。','という巡りが流れています。急いで結論を出す必要はありません。','という色合いがあります。今日の判断の背景として覚えておいて。']},

    function previousKey(){const d=new Date();d.setDate(d.getDate()-1);return keyFor(d)}
    function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
    function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    function data(){try{return JSON.parse(localStorage.getItem(STORAGE))||{}}catch(e){return{}}}
    function save(v){try{localStorage.setItem(STORAGE,JSON.stringify(v))}catch(e){}}
    function seededDraw(){const r=rng(hash('花札日和:'+state.today));const pool=[...CARDS];for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return{ids:pool.slice(0,3).map(c=>c.id),variant:Math.floor(r()*3),created:Date.now()}}
    function weather(cards){const high=cards.filter(c=>c.rank==='光'||c.rank==='種').length;const low=cards.filter(c=>c.rank==='カス').length;const months=cards.map(c=>c.month);if(high>=2)return'追い風';if(cards.some(c=>c.month===11)||cards.filter(c=>c.el==='水').length>=2)return'雨宿り';if(Math.max(...months)-Math.min(...months)>=8)return'切替日和';if(low===3)return'仕込み日和';return'凪の日'}

    function cardSvg(c){
      const motif={1:'M28 79 Q46 28 64 79',2:'M20 84 Q42 45 67 25',3:'M24 72 Q47 28 69 72',4:'M18 24 Q46 44 74 24',5:'M28 82 L30 30 M45 82 L46 24 M62 82 L60 31',6:'M23 52 Q46 22 69 52 Q46 75 23 52',7:'M25 82 Q37 55 29 30 M51 82 Q64 55 56 30',8:'M10 72 Q34 58 53 66 Q68 75 82 59',9:'M46 22 C67 24 69 58 46 71 C23 58 25 24 46 22',10:'M15 82 Q31 52 46 35 Q63 52 77 82',11:'M46 15 Q64 42 46 70 Q28 42 46 15',12:'M21 78 L46 21 L71 78'}[c.month];
      const center=c.rank==='光'?`<circle cx="46" cy="42" r="18" fill="${c.ac}" opacity=".13"/><text x="46" y="47" text-anchor="middle" font-size="16" fill="${c.ac}" opacity=".8">✦</text>`:c.rank==='種'?`<ellipse cx="46" cy="44" rx="19" ry="12" fill="${c.ac}" opacity=".11"/>`:c.rank==='短冊'?`<rect x="36" y="18" width="20" height="47" rx="3" fill="${c.ac}" opacity=".13"/>`:'';
      return `<svg viewBox="0 0 92 124" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${c.name}、${c.rank}"><rect width="92" height="124" fill="${c.cl}" rx="5"/><rect x="3" y="3" width="86" height="118" rx="3" fill="none" stroke="${c.ac}" stroke-width="${c.rank==='光'?1.4:.7}" opacity=".62"/>${center}<path d="${motif}" stroke="${c.ac}" stroke-width="1.45" fill="none" opacity=".42"/><rect x="3" y="85" width="86" height="36" fill="${c.ac}" opacity=".11"/><line x1="3" y1="85" x2="89" y2="85" stroke="${c.ac}" opacity=".35"/><text x="46" y="100" text-anchor="middle" font-size="6.4" fill="${c.ac}" font-family="serif" font-weight="bold">${c.name}</text><text x="46" y="115" text-anchor="middle" font-size="5.1" fill="${c.ac}" opacity=".7" font-family="serif">${c.mj}　${c.rank}</text></svg>`
    }
    function pashi(){if(!state.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;const ctx=pashi.ctx||(pashi.ctx=new A());const b=ctx.createBuffer(1,ctx.sampleRate*.075,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++){const t=i/ctx.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-t*78)*.55}const s=ctx.createBufferSource(),g=ctx.createGain();g.gain.setValueAtTime(1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.075);s.buffer=b;s.connect(g);g.connect(ctx.destination);s.start()}catch(e){}}
    function vibrate(){try{if(navigator.vibrate)navigator.vibrate(18)}catch(e){}}
    function showToast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.classList.remove('show'),1800)}
    function formatDate(){const d=new Date(),jp=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(d);$('#todayLabel').textContent=jp+' の巡り'}
    function prepare(){
      const stored=data();state.sound=stored.sound!==false;updateSound();
      state.draw=stored.days?.[state.today]||seededDraw();
      state.draw.ids.map(id=>CARDS[id]).forEach((c,i)=>$('#card'+i+' .front').innerHTML=cardSvg(c));
      const yesterday=stored.days?.[previousKey()];if(yesterday&&!yesterday.reflection){const cards=yesterday.ids.map(id=>CARDS[id]);$('#reflectionText').textContent=`昨日の「${makeAction(cards,yesterday.variant).title}」は、どうでしたか？`;$('#reflection').classList.add('show')}
      if(stored.days?.[state.today])render(false);
    }
    function makeAction(cards,variant){const key=cards[2].el,choice=ACTIONS[key][variant%ACTIONS[key].length];return{title:choice,text:`「${cards[2].name}」が示すのは、${cards[2].desc}。全部を変えようとせず、${choice}ことから始めてみましょう。`}}
    function render(animate=true){
      if(state.revealing)return;state.revealing=true;const cards=state.draw.ids.map(id=>CARDS[id]);
      cards.forEach((c,i)=>{const reveal=()=>{$('#card'+i).classList.add('revealed');pashi();vibrate()};animate?setTimeout(reveal,180+i*430):reveal()});
      const delay=animate?1550:30;setTimeout(()=>{
        const w=weather(cards);$('#weatherTitle').textContent=w;$('#weatherMessage').textContent=WEATHER[w].msg;
        $('#readings').innerHTML=cards.map((c,i)=>`<article class="reading"><div class="reading-head"><span class="reading-index">${['一','二','三'][i]}</span><span class="reading-role">${ROLES[i].name}</span><span class="reading-card">${c.name}</span></div><p>${ROLES[i].lead}「${c.desc}」${ROLES[i].tails[state.draw.variant%ROLES[i].tails.length]}</p></article>`).join('');
        const a=makeAction(cards,state.draw.variant);$('#actionTitle').textContent=a.title;$('#actionText').textContent=a.text;$('#result').classList.add('show');$('#drawBtn').textContent='本日は占い済み';$('#drawBtn').disabled=true;state.revealing=false;
        const stored=data();stored.sound=state.sound;stored.days=stored.days||{};stored.days[state.today]=state.draw;Object.keys(stored.days).sort().slice(0,-14).forEach(k=>delete stored.days[k]);save(stored);
        if(animate)$('#result').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
      },delay)
    }
    function updateSound(){const on=state.sound;$('#soundBtn').setAttribute('aria-pressed',String(on));$('#soundIcon').textContent=on?'♪':'×';$('#soundText').textContent=on?'音あり':'消音'}
    $('#drawBtn').addEventListener('click',()=>render(true));
    $('#againBtn').addEventListener('click',()=>$('#drawStage').scrollIntoView({behavior:'smooth'}));
    $('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;const stored=data();stored.sound=state.sound;save(stored);updateSound();showToast(state.sound?'音をオンにしました':'音をオフにしました')});
    $$('.reflection-actions button').forEach(b=>b.addEventListener('click',()=>{const stored=data(),d=stored.days?.[previousKey()];if(d){d.reflection=b.dataset.reflect;save(stored)}$('#reflection').classList.remove('show');showToast('昨日の記録を残しました')}));
    formatDate();prepare();
  })();
  </script>
</body>
