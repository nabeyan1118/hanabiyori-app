<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同じ月をそろえて消す</title><style>*{box-sizing:border-box}body{margin:0;background:#1d2b21;color:#f3ead2;font-family:system-ui,sans-serif;text-align:center}h1{font-size:1.5rem}button,a{touch-action:manipulation}button{border:0;border-radius:10px;background:#eee1c0;color:#1d2b21;font:700 1rem system-ui;padding:14px 18px;cursor:pointer}button:disabled{opacity:.5}footer{margin:30px 0 16px;font-size:.75rem;opacity:.7}main{max-width:650px;margin:auto;padding:8px}.info{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:10px}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.tile{position:relative;aspect-ratio:2/3;padding:0;border:3px solid var(--color);border-radius:5px;background:#34483a;overflow:visible}.tile img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px}.tile.selected{box-shadow:0 0 0 3px #fff6b4,0 0 16px 5px #ffe77a;z-index:1}.tile.matched{animation:glow .45s ease-in-out}.tile.gone{visibility:hidden;pointer-events:none}@keyframes glow{50%{filter:brightness(1.8);box-shadow:0 0 18px 8px #fff2a2}}#clear{margin:20px}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d2b21"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="花札日和"><link rel="apple-touch-icon" href="app-touch-icon.png"></head><body><main><h1>同じ月をそろえて消す</h1><div class="info"><span>今日の盤面：<span id="date"></span></span><span>時間：<span id="timer">00:00</span></span></div><p>同じ月の札を4枚タップしよう</p><div id="board" class="board"></div><div id="clear" hidden><p id="clearText"></p><button id="restart">もう一度</button></div></main><footer>ビルド 2026-11-28</footer><script>
const colors = ['#4a7a5c','#a05a68','#d9a7b0','#97889f','#6a6390','#c07a92','#9a6a86','#b39b5e','#cdb052','#a85a3c','#8a9a5b','#a298b8'];
const monthOf = id => Math.floor(id / 4) + 1;
function jstDate(now = new Date()) { const d = new Date(now.getTime() + 9*60*60*1000); return `${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,'0')}${String(d.getUTCDate()).padStart(2,'0')}`; }
function shuffledForDate(date) { let seed=Number(date) >>> 0; const cards=Array.from({length:48},(_,i)=>i); for(let i=cards.length-1;i>0;i--){ seed=(Math.imul(seed,1664525)+1013904223)>>>0; const j=Math.floor(seed/4294967296*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; } return cards; }
function matchingFour(selected, id) { const month=monthOf(id); return [...selected].filter(card=>monthOf(card)===month); }
function sound(){try{const a=new Audio('pashi.m4a');const p=a.play();if(p)p.catch(()=>{});}catch(_){}}
const $=id=>document.getElementById(id); let selected, removed, started, interval, busy, boardDate;
function elapsed(){return Math.floor((Date.now()-started)/1000)}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function start(){clearInterval(interval); boardDate=jstDate(); selected=new Set(); removed=0; busy=false; started=Date.now(); $('timer').textContent='00:00'; $('date').textContent=`${boardDate.slice(0,4)}/${boardDate.slice(4,6)}/${boardDate.slice(6)}`; $('clear').hidden=true; $('board').replaceChildren(); for(const id of shuffledForDate(boardDate)){const b=document.createElement('button');b.className='tile';b.dataset.id=id;b.style.setProperty('--color',colors[monthOf(id)-1]);b.setAttribute('aria-label',`${monthOf(id)}月の札`);b.setAttribute('aria-pressed','false');const img=document.createElement('img');img.src=`assets/cards/card-${String(id).padStart(2,'0')}.webp`;img.alt='';b.append(img);b.addEventListener('click',()=>select(id,b));$('board').append(b);} interval=setInterval(()=>$('timer').textContent=formatTime(elapsed()),250); }
function select(id,button){if(busy)return; if(selected.has(id)){selected.delete(id);button.classList.remove('selected');button.setAttribute('aria-pressed','false');return;} selected.add(id);button.classList.add('selected');button.setAttribute('aria-pressed','true');const matches=matchingFour(selected,id);if(matches.length===4){busy=true; const tiles=[...$('board').children].filter(b=>matches.includes(Number(b.dataset.id))); tiles.forEach(b=>b.classList.add('matched')); sound(); setTimeout(()=>{tiles.forEach(b=>b.classList.add('gone'));matches.forEach(x=>selected.delete(x));removed+=4;busy=false;if(removed===48){clearInterval(interval);const time=formatTime(elapsed());$('timer').textContent=time;$('clearText').textContent=`クリア！ かかった時間：${time}`;$('clear').hidden=false;}},450);}}
$('restart').addEventListener('click',start);start();
</script></body></html>
