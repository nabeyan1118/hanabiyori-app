<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>次の札は大きい？小さい？</title><style>*{box-sizing:border-box}body{margin:0;background:#1d2b21;color:#f3ead2;font-family:system-ui,sans-serif;text-align:center}h1{font-size:1.5rem}button,a{touch-action:manipulation}button{border:0;border-radius:10px;background:#eee1c0;color:#1d2b21;font:700 1rem system-ui;padding:14px 18px;cursor:pointer}button:disabled{opacity:.5}footer{margin:30px 0 16px;font-size:.75rem;opacity:.7}main{max-width:500px;margin:auto;padding:12px}.stats{display:flex;justify-content:center;gap:24px;font-weight:bold}.card{width:min(42vw,160px);aspect-ratio: 2/3;object-fit:cover;border:5px solid;border-radius:8px;background:#33483a}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.message{min-height:3em;font-weight:bold}.result{font-size:1.2rem}</style></head><body><main><h1>次の札は大きい？小さい？</h1><div class="stats"><p>れんぞく <span id="streak">0</span></p><p>残りの山 <span id="remaining">47</span>枚</p></div><p>いまの札：<span id="month"></span>月</p><img id="card" class="card" alt=""><p id="message" class="message" aria-live="polite">次の札の月を当てよう！</p><div id="choices" class="choices"><button data-guess="higher">つぎは 大きい</button><button data-guess="lower">つぎは 小さい</button></div><div id="end" hidden><p id="result" class="result"></p><button id="restart">もう一度</button></div></main><footer>ビルド 2026-11-27</footer><script>
const colors = ['#4a7a5c','#a05a68','#d9a7b0','#97889f','#6a6390','#c07a92','#9a6a86','#b39b5e','#cdb052','#a85a3c','#8a9a5b','#a298b8'];
const monthOf = id => Math.floor(id / 4) + 1;
function judge(current, next, guess) { const diff = monthOf(next) - monthOf(current); return diff === 0 ? 'safe' : ((diff > 0) === (guess === 'higher') ? 'correct' : 'wrong'); }
function sound() { try { const a = new Audio('pashi.m4a'); const p = a.play(); if (p) p.catch(() => {}); } catch (_) {} }
let deck, current, streak, ended;
const $ = id => document.getElementById(id);
function display() { $('card').src = `assets/cards/card-${String(current).padStart(2,'0')}.webp`; $('card').alt = `${monthOf(current)}月の札`; $('card').style.borderColor = colors[monthOf(current)-1]; $('month').textContent = monthOf(current); $('streak').textContent = streak; $('remaining').textContent = deck.length; }
function start() { deck = Array.from({length:48},(_,i)=>i); for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} current=deck.pop(); streak=0; ended=false; $('end').hidden=true; $('choices').hidden=false; $('message').textContent='次の札の月を当てよう！'; display(); sound(); }
function finish(reason) { ended=true; $('choices').hidden=true; $('end').hidden=false; $('result').textContent=`${reason} れんぞく記録：${streak}回`; }
function play(guess) { if(ended || !deck.length)return; const next=deck.pop(); const outcome=judge(current,next,guess); current=next; if(outcome==='correct')streak++; display(); sound(); $('message').textContent=outcome==='safe'?'同じ月！ セーフ':outcome==='correct'?'正解！':'ざんねん！'; if(outcome==='wrong')finish('ゲーム終了！'); else if(!deck.length)finish('山がなくなりました！'); }
document.querySelectorAll('[data-guess]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.guess))); $('restart').addEventListener('click',start); start();
</script></body></html>
